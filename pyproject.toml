[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "dags"
description = "Tools to create executable dags from interdependent functions."
readme = { file = "README.md", content-type = "text/markdown" }
keywords = []
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "flatten-dict",
  "networkx>=3.6",
]
[[project.maintainers]]
name = "Hans-Martin von Gaudecker"
email = "hmgaudecker@uni-bonn.de"

[[project.maintainers]]
name = "Tim Mensinger"
email = "mensingertim@gmail.com"
[[project.authors]]
name = "Janoś Gabler"
email = "janos.gabler@gmail.com"

[[project.authors]]
name = "Tobias Raabe"

[[project.authors]]
name = "Tim Mensinger"
email = "mensingertim@gmail.com"

[[project.authors]]
name = "Hans-Martin von Gaudecker"
email = "hmgaudecker@uni-bonn.de"
[project.urls]
Github = "https://github.com/OpenSourceEconomics/dags"
Repository = "https://github.com/OpenSourceEconomics/dags"
Tracker = "https://github.com/OpenSourceEconomics/dags/issues"

[tool.hatch]
version.source = "vcs"
metadata.allow-direct-references = true
build.hooks.vcs.version-file = "src/dags/_version.py"
build.targets.sdist.exclude = [ "tests" ]
build.targets.sdist.only-packages = true
build.targets.wheel.only-include = [ "src" ]
build.targets.wheel.sources = [ "src" ]

[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-64", "osx-arm64", "win-64" ]
[tool.pixi.dependencies]
jupyterlab = "*"
prek = ">=0.5.9"
python = ">=3.11,<3.16"
[tool.pixi.pypi-dependencies]
dags = { path = ".", editable = true }
pdbp = "*"
[tool.pixi.feature.docs.dependencies]
jupyter-book = ">=2.1.7"
mystmd = ">=1.13.0"
numpy = "*"
[tool.pixi.feature.docs.tasks]
build-docs = { cmd = "jupyter book build --html --execute", cwd = "docs" }
view-docs = { cmd = "jupyter book start --execute", cwd = "docs" }
[tool.pixi.feature.py311.dependencies]
python = "~=3.11.0"
[tool.pixi.feature.py312.dependencies]
python = "~=3.12.0"
[tool.pixi.feature.py313.dependencies]
python = "~=3.13.0"
[tool.pixi.feature.py314.dependencies]
python = "~=3.14.0"
[tool.pixi.feature.py314.pypi-dependencies]
types-networkx = "*"
[tool.pixi.feature.py315.dependencies]
python = "~=3.15.0"
[tool.pixi.feature.tests.dependencies]
numpy = "*"
[tool.pixi.feature.tests.pypi-dependencies]
beartype = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
[tool.pixi.feature.tests.tasks]
tests = "pytest"
tests-with-cov = "pytest --cov-report=xml --cov=./"
[tool.pixi.environments]
docs = [ "docs", "py314" ]
py311 = [ "py311", "tests" ]
py312 = [ "py312", "tests" ]
py313 = [ "py313", "tests" ]
py314 = [ "py314", "tests" ]
py315 = [ "py315", "tests" ]

[tool.ruff]
fix = true
unsafe-fixes = false
[tool.ruff.lint]
select = [ "ALL" ]
extend-ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
  "COM812",  # Conflicts with ruff-format
  "CPY001",  # Copyright notice at top of file
  "EM101",   # Exception must not use a string literal
  "EM102",   # Exception must not use an f-string literal
  "FA100",   # Missing from __future__ import annotations
  "FA102",   # Missing from __future__ import annotations
  "FIX002",  # Line contains TODO
  "ISC001",  # Conflicts with ruff-format
  "PLR0917", # Too many positional arguments
  "TC001",   # Move application import into a type-checking block
  "TC002",   # Move third-party import into a type-checking block
  "TC003",   # Move standard library import into a type-checking block
  "TRY003",  # Long messages outside exception class
]
per-file-ignores."docs/**/*" = [
  "ANN001", # Missing type annotation for function argument
  "ANN002", # Missing type annotation for *args
  "ANN003", # Missing type annotation for **kwargs
  "ANN201", # Missing return type annotation for public function
  "ANN202", # Missing return type annotation for private function
  "ARG001", # Unused function argument
  "D100",   # Missing docstring in public module
  "D103",   # Missing docstring in public function
  "D104",   # Missing docstring in public package
  "T201",   # print found
]
per-file-ignores."tests/*" = [
  "ANN001",  # Missing type annotation for function argument
  "ANN002",  # Missing type annotation for *args
  "ANN003",  # Missing type annotation for **kwargs
  "ANN201",  # Missing return type annotation for public function
  "ANN202",  # Missing return type annotation for private function
  "D100",    # Missing docstring in public module
  "D103",    # Missing docstring in public function
  "D104",    # Missing docstring in public package
  "D401",    # First line of docstring should be in imperative mood
  "FBT001",  # Boolean-typed positional argument in function definition
  "INP001",  # Implicit namespace packages
  "PLC2401", # Variable name contains a non-ASCII character
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert
]
per-file-ignores."tests/test_dag.py" = [ "ARG001" ]  # Unused function argument
pydocstyle.convention = "google"

[tool.codespell]
ignore-words-list = "arithmetics,disjointness,fpr,ist,mape,nd,nin,statics"
skip = "*.lock,*.svg,*.bib,*.ipynb"

[tool.pyproject-fmt]
column_width = 88
max_supported_python = "3.15"
table_format = "long"
expand_tables = [
  "tool.pixi.dependencies",
  "tool.pixi.environments",
  "tool.pixi.feature",
  "tool.pixi.feature.docs",
  "tool.pixi.feature.docs.dependencies",
  "tool.pixi.feature.docs.tasks",
  "tool.pixi.feature.py311",
  "tool.pixi.feature.py311.dependencies",
  "tool.pixi.feature.py312",
  "tool.pixi.feature.py312.dependencies",
  "tool.pixi.feature.py313",
  "tool.pixi.feature.py313.dependencies",
  "tool.pixi.feature.py314",
  "tool.pixi.feature.py314.dependencies",
  "tool.pixi.feature.py314.pypi-dependencies",
  "tool.pixi.feature.py315",
  "tool.pixi.feature.py315.dependencies",
  "tool.pixi.feature.tests",
  "tool.pixi.feature.tests.pypi-dependencies",
  "tool.pixi.feature.tests.tasks",
  "tool.pixi.pypi-dependencies",
  "tool.pixi.pypi-dependencies.dags",
  "tool.pixi.workspace",
]
collapse_tables = [ "tool.hatch", "tool.pytest", "tool.ty" ]

[tool.ty]
# `.ai-instructions` is the shared-instructions submodule, not this package; its
# hook scripts import tools that live only in their pre-commit environments.
src.exclude = [ ".ai-instructions", "docs/**/*.ipynb" ]
# ty resolves third-party imports from this pixi env. The pre-commit hook runs
# ty directly; pixi owns the project environment. Run `pixi install` once.
environment.python = ".pixi/envs/py314"
rules.ambiguous-protocol-member = "error"
rules.deprecated = "error"
rules.division-by-zero = "error"
rules.ignore-comment-unknown-rule = "error"
rules.ineffective-final = "error"
rules.invalid-enum-member-annotation = "error"
rules.invalid-ignore-comment = "error"
rules.invalid-legacy-positional-parameter = "error"
rules.redundant-cast = "error"
rules.unused-awaitable = "error"
rules.unused-ignore-comment = "error"

[tool.pytest]
ini_options.norecursedirs = [ "docs" ]
ini_options.addopts = [ "--pdbcls=pdbp:Pdb" ]
ini_options.filterwarnings = []

# Read by the `dead-code` hook (`.ai-instructions/hooks/dead_code.py`). A library
# lists its package under `public`, so only `_`-private definitions are reported.
[tool.dead-code]
consumers = [ "src", "docs" ]
public = [ "src/dags/" ]

[tool.yamlfix]
line_length = 88
none_representation = "null"
sequence_style = "block_style"
