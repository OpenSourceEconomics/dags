---
name: main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
# Automatically cancel a previous run.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  run-tests:
    name: Run tests for ${{ matrix.os }} on ${{ matrix.environment }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel  # intel
          - macos-latest  # arm
          - windows-latest
        environment:
          - py311
          - py312
          - py313
          - py314
          - py315
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true
          environments: ${{ matrix.environment }}
      - name: Run all tests except Linux and py314.
        if: runner.os != 'Linux' || matrix.environment != 'py314'
        shell: bash -el {0}
        run: pixi run --locked -e ${{ matrix.environment }} tests
      - name: Run tests with codecov on Linux and py314.
        if: runner.os == 'Linux' && matrix.environment == 'py314'
        shell: bash -el {0}
        run: pixi run --locked -e ${{ matrix.environment }} tests-with-cov
      - name: Upload coverage report.
        if: runner.os == 'Linux' && matrix.environment == 'py314'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  run-ty:
    name: Run ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # `.ai-instructions` carries the dead-code script.
          submodules: true
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true
          environments: py314
      - name: Run ty
        run: pixi run --locked -e py314 prek run ty --all-files
        shell: bash -el {0}
      - name: Refuse dead internal and test code
        run: pixi run --locked -e py314 prek run dead-code --all-files
        shell: bash -el {0}
